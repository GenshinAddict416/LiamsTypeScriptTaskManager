<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager Dashboard</title>
  <style>
    /* Modern Dark Theme Variables */
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #334155;
      
      /* Importance Badge Colors */
      --badge-low: #10b981;
      --badge-mid: #f59e0b;
      --badge-hi: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 900px;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #818cf8, #e0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Cards & Layout Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 320px 1fr;
      }
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      color: #e2e8f0;
    }

    /* Forms & Inputs */
    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], select {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent);
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    /* Clean Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 60dvh;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .task-item {
      background-color: #1e293b;
      border-left: 4px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.15s ease;
    }

    .task-item:hover {
      transform: translateX(4px);
    }

    /* Dynamic Border Colors based on priority class */
    .task-item.priority-LOW { border-left-color: var(--badge-low); }
    .task-item.priority-MID { border-left-color: var(--badge-mid); }
    .task-item.priority-HI  { border-left-color: var(--badge-hi); }

    .task-info h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .task-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    /* Status and Importance Badges */
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .badge.importance-LOW { background-color: rgba(16, 185, 129, 0.15); color: var(--badge-low); }
    .badge.importance-MID { background-color: rgba(245, 158, 11, 0.15); color: var(--badge-mid); }
    .badge.importance-HI  { background-color: rgba(239, 68, 68, 0.15); color: var(--badge-hi); }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Button Layout Adjustments */
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn-edit {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      width: auto;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-edit:hover {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-delete {
      background-color: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      width: auto;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-delete:hover {
      background-color: #ef4444;
      color: #ffffff;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <header>
      <h1>📋 Task Control Center</h1>
    </header>

    <div class="grid">
      <aside class="card">
        <h2>New Task</h2>
        <form id="taskForm">
          <div class="form-group">
            <label for="title">Task Title</label>
            <input type="text" id="title" placeholder="e.g., Fix server bug" required>
          </div>
          
          <div class="form-group">
            <label for="importance">Importance</label>
            <select id="importance">
              <option value="LOW">Low Priority</option>
              <option value="MID">Medium Priority</option>
              <option value="HI">High Priority</option>
            </select>
          </div>

          <div class="form-group">
            <label for="completion">Status</label>
            <select id="completion">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <button type="submit">Create Task</button>
        </form>
      </aside>

      <main class="card">
        <h2>Your Tasks</h2>
        <div id="taskList" class="task-list">
          </div>
      </main>
    </div>
  </div>

  <script>
    const API_URL = '/api/tasks';

    window.addEventListener('pagehide', () => {
      navigator.sendBeacon('/api/shutdown');
    });

    async function loadTasks() {
      const response = await fetch(API_URL);
      const tasks = await response.json();
      const taskList = document.getElementById('taskList');
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        taskList.innerHTML = '<div class="empty-state">No active tasks found. Enjoy your day!</div>';
        return;
      }

      tasks.forEach(task => {
        const taskItem = document.createElement('div');
        taskItem.className = `task-item priority-${task.importance}`;
        
        taskItem.innerHTML = `
          <div class="task-info">
            <h3>${task.title}</h3>
            <div class="task-meta">
              <span class="badge importance-${task.importance}">${task.importance}</span>
              <span class="status-text">• ${task.completion}</span>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn-edit" onclick="advanceTask(${task.id})">🔄 Progress</button>
            <button class="btn-delete" onclick="deleteTask(${task.id})">Remove</button>
          </div>
        `;
        taskList.appendChild(taskItem);
      });
    }

    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('title').value,
        importance: document.getElementById('importance').value,
        completion: document.getElementById('completion').value
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      document.getElementById('taskForm').reset();
      loadTasks();
    });

    async function advanceTask(id) {
      await fetch(`${API_URL}/${id}/progress`, { 
        method: 'PUT' 
      });
      loadTasks();
    }

    async function deleteTask(id) {
      if (confirm('Are you sure you want to delete this task?')) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadTasks();
      }
    }

    loadTasks();
  </script>
</body>
</html>
